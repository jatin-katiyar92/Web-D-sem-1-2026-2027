<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 9 - Quotation and Citation Elements</title>
    <style>
        .output-box {
            border: 1px solid #a3cfbb;
            padding: 15px;
            font-family: serif; /* Image ke font style ke jaisa */
        }
    </style>
</head>
<body>

    
    <div class="output-box">
        <!-- Long Quote -->
        <blockquote>The best way to predict the future is to create it.</blockquote>
        
        <!-- Inline Quote -->
        <p>As he said, <q>Stay hungry, stay foolish.</q></p>
        
        <!-- Citation -->
        <p>Book: <cite>The Pragmatic Programmer</cite></p>
        
        <!-- Abbreviation with Tooltip -->
        <p><abbr title="World Wide Web Consortium">W3C</abbr> sets web standards.</p>
        
        <!-- Address Element -->
        <address>
            Contact: Admin Office<br>
            College Road, Delhi
        </address>
        
        <!-- Deleted and Inserted text (Price update) -->
        <p>Old price <del>500</del> New price <ins>400</ins></p>
    </div>


</body>
</html>
