<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project:Accessible Student Admission Page</title>
</head>
<body>
    <h1 align="center">ABC College Admission 2026</h1>
    <hr/>
    <h3 align="center">Courses and Fees</h3>
    <p align="center">Avaible Courses</p>
    <table border="n" align="center" width="70%">
        <tr>
            <th>Course</th>
            <th>Seats</th>
            <th>Fees</th>

        </tr>
        <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>&#8377;90,000</td>
        </tr>
        <tr>
            <td>BCA</td>
            <td>60</td>
            <td>&#8377;45000</td>
        </tr>
    </table>
    <fieldset align="center" width="70%">
        <legend width="70%">Application form</legend>
        <form action="">
            <lable for="name">Name:</lable>
            <input type="text" id="name" >
            <p>
            <lable for="email">Email:</lable>
            <input type="email" id="email">
            </p>
            <lable for="course">Course</lable>
            <select course="course" id="course">
                <option value="B.Tech CSE">B.Tech CSE</option>
                   <option value="B.Tech civil">B.Tech civil</option>
                      <option value="B.Tech ECE">B.Tech ECE</option>
                         <option value="B.Tech MLC">B.Tech MLC</option>
            </select>
        </br>
           <p> <lable for="statement">Statement</lable></p>
            <textarea id="statement" rows="5" cols="30"></textarea>
            <br/>
            <lable for="apply"></lable>
            <input type="submit"  id="apply" value="Apply">


        </form>
    </fieldset>


    
</body>
</html>
