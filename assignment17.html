<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Attributes and Input Validation</title>
</head>
<body>
    <form action="/">
        <lable for="full name"></lable>
        <input type="text" id="full name" placeholder="Full name">
        <p>
        <lable for="email"></lable>
        <input type="email" id="email" placeholder="you@college.edu">
        </p>
        <lable for=" mobile number"></lable>
        <input type="number" id="mobile no" value="mobile number" placeholder="10-digit mobile" maxlength="10">
        <p>
        <lable for="charactor"></lable>
        <input type="text" id="charactor" placeholder="Min 6 characters" minlength="6">
        </p>
        <lable for="age"></lable>
        <input type="number" id="age" placeholder="Age" minlength="17" maxlength="30">
        <p>
        <lable for="register"></lable>
        <input type="submit" id="register" value="Register" placeholder="Register">
        </p>

    </form>
    
</body>
</html>
