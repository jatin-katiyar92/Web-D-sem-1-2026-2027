<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation Bar Assignment</title>
    <style>
        /* Navbar container ki styling */
        .navbar {
            background-color: #333333; /* Dark background */
            padding: 10px 20px;
            display: inline-block; /* Jitna content hai utni width lene ke liye */
        }

        /* Links ki styling */
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        /* Hover effect (optional) */
        .navbar a:hover {
            background-color: #555555;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <p>Output</p>
    
    <!-- Outer box jaisa image me dikh raha hai -->
    <div style="border: 1px solid #a3cfbb; padding: 15px; display: inline-block;">
        <div class="navbar">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#courses">Courses</a>
            <a href="#contact">Contact</a>
        </div>
    </div>

</body>
</html>
