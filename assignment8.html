<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignments 8 and 9</title>
    <style>
        .output-box {
            border: 1px solid #a3cfbb;
            padding: 15px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    
    <div class="output-box">
        <p><b>Links demo</b></p>
        
        <!-- External Link -->
        <p><a href="https://www.google.com" target="_blank">External link</a></p>
        
        <!-- Internal / Jump to bottom Link -->
        <p><a href="#bottom-section">Jump to bottom</a></p>
        
        <!-- Email Link -->
        <p><a href="mailto:support@example.com">Email us</a></p>
        
        <!-- Image as Link -->
        <p>Logo</p>
        <a href="#top">
            <img src="logo.png" alt="Logo" width="40" height="40" style="border: 1px solid #ccc; padding: 2px;">
        </a>

        <!-- Thoda gap dene ke liye taaki scroll karke bottom tak ja sakein -->
        <div style="margin-top: 350px;" id="bottom-section">
            Bottom. <a href="#">Back to top</a>
        </div>
    </div>


</body>
</html>
