<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Block and Inline Elements</title>
    <style>
        /* Block elements ke liye styling */
        .block-box {
            background-color: #cfe2ff;
            padding: 5px 10px;
            margin-bottom: 5px;
        }

        /* Inline elements ke liye styling */
        .inline-box {
            background-color: #d1e7dd;
            padding: 2px 5px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    
    <div style="border: 1px solid #a3cfbb; padding: 10px; display: inline-block;">
        <!-- Block Elements (Ye har nayi line se shuru hote hain aur poori width lete hain) -->
        <div class="block-box">Block 1</div>
        <div class="block-box">Block 2</div>
        
        <!-- Inline Elements (Ye ek hi line me side-by-side aate hain) -->
        <span class="inline-box">Inline 1</span>
        <span class="inline-box">Inline 2</span>
        <span class="inline-box">Inline 3</span>
    </div>

</body>
</html>
